<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2979FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer HUD Hexagon -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" 
           stroke="url(#glowGrad)" stroke-width="2.5" fill="#060c1d" fill-opacity="0.85" filter="url(#neonBlur)"/>
  
  <!-- Outer Corner Tech Ticks -->
  <line x1="60" y1="1" x2="60" y2="8" stroke="#00E5FF" stroke-width="2"/>
  <line x1="108" y1="33" x2="114" y2="30" stroke="#00E5FF" stroke-width="2"/>
  <line x1="108" y1="87" x2="114" y2="90" stroke="#00E5FF" stroke-width="2"/>
  <line x1="60" y1="114" x2="60" y2="119" stroke="#00E5FF" stroke-width="2"/>
  <line x1="12" y1="87" x2="6" y2="90" stroke="#00E5FF" stroke-width="2"/>
  <line x1="12" y1="33" x2="6" y2="30" stroke="#00E5FF" stroke-width="2"/>

  <!-- Inner Reticle Circle -->
  <circle cx="60" cy="60" r="42" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"/>
  <circle cx="60" cy="60" r="32" stroke="#2979FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="60" cy="60" r="22" fill="url(#centerGlow)"/>

  <!-- Dynamic Pulse Wave Vector -->
  <path d="M 28 60 L 44 60 L 52 42 L 60 78 L 68 49 L 74 64 L 78 60 L 92 60" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)"/>
  <path d="M 28 60 L 44 60 L 52 42 L 60 78 L 68 49 L 74 64 L 78 60 L 92 60" 
        stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crosshair Tech Markers -->
  <line x1="60" y1="20" x2="60" y2="28" stroke="#00E5FF" stroke-width="1.5"/>
  <line x1="60" y1="92" x2="60" y2="100" stroke="#00E5FF" stroke-width="1.5"/>
  <line x1="20" y1="60" x2="28" y2="60" stroke="#00E5FF" stroke-width="1.5"/>
  <line x1="92" y1="60" x2="100" y2="60" stroke="#00E5FF" stroke-width="1.5"/>

  <!-- Focal Center Beacon -->
  <circle cx="60" cy="60" r="3" fill="#00E5FF"/>
</svg>
